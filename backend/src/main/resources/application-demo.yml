server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:note_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

file:
  upload-path: ${UPLOAD_PATH:./uploads/}

app:
  image-base-url: ${IMAGE_BASE_URL:http://localhost:8080/uploads/}
  jwt-secret: ${JWT_SECRET:MySuperSecretKeyForPersonalNoteSystem2024+}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
