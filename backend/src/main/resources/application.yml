server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&useSSL=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

file:
  upload-path: ${UPLOAD_PATH:/tmp/uploads/}

app:
  image-base-url: ${IMAGE_BASE_URL:http://localhost:8080/uploads/}
  jwt-secret: ${JWT_SECRET:MySuperSecretKeyForPersonalNoteSystem2024+}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
